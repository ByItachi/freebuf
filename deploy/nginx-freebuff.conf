# Freebuff reverse proxy — copy to /etc/nginx/sites-available/freebuff,
# then: ln -s /etc/nginx/sites-available/freebuff /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#       certbot --nginx -d app.yourdomain.com

server {
    listen 80;
    server_name app.yourdomain.com;

    # Certbot writes the redirect to HTTPS here after issuing the cert.
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # AI chat responses can stream slowly — relax timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;
    }
}
