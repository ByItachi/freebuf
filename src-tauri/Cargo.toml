[package]
name = "manus"
version = "0.1.0"
description = "Manus — AI Agent Studio desktop app"
authors = ["Manus"]
edition = "2021"

[lib]
name = "manus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
